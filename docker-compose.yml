version: '3.8'
services:
  evershop-app:
    image: evershop/evershop:latest
    container_name: evershop-app-1
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_PASSWORD: postgres
      DB_USER: postgres
      DB_NAME: postgres
    networks:
      - myevershop
    restart: always

  evershop-nginx:
    image: nginx:latest
    container_name: evershop-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 80:80
      - 443:443
    networks:
      - myevershop
    restart: always

  database:
    image: postgres:16
    container_name: evershop-db
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - myevershop
    restart: always

networks:
  myevershop:
    driver: bridge

volumes:
  postgres-data:
