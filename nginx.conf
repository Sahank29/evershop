server {
    listen 80;
    server_name coloree.in www.coloree.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name coloree.in www.coloree.in;

    ssl_certificate /etc/letsencrypt/live/coloree.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coloree.in/privkey.pem;

    location / {
        proxy_pass http://evershop-app-1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
